<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniomni Creatorial & Deep Research Canvas Studio</title>
  
  <!-- Tailwind CSS & Three.js CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg-base: #02040a;
      --cyan-glow: rgba(6, 182, 212, 0.4);
      --gold-glow: rgba(251, 191, 36, 0.4);
      --border-color: rgba(6, 182, 212, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace;
      user-select: none;
    }
    body {
      background-color: var(--bg-base);
      color: #e2e8f0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    
    /* Fixed Strata Viewport Containment */
    #stratum-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas.stratum-plane {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #stratum-0-canvas { z-index: 0; }
    #stratum-1-canvas { z-index: 1; }

    #stratum-ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .interactive-panel {
      pointer-events: auto;
      background: rgba(8, 14, 28, 0.9);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75);
    }

    .glass-tab {
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .glass-tab.active {
      background: rgba(6, 182, 212, 0.15);
      border-bottom: 2px solid #06b6d4;
      color: #06b6d4;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
    ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="stratum-root">
    <!-- Stratum 0: Ambient 2D Mathematical Matrix -->
    <canvas id="stratum-0-canvas" class="stratum-plane"></canvas>

    <!-- Stratum 1: 3D Spatial Computing Context -->
    <div id="stratum-1-canvas" class="stratum-plane"></div>

    <!-- Stratum 2 & 3: UI Dashboard, Live Editor & Sandboxed Render Plane -->
    <div id="stratum-ui-overlay">
      
      <!-- Top Header & Global System Status -->
      <header class="interactive-panel w-full px-6 py-2.5 border-b border-cyan-500/20 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
          <span class="font-bold text-sm tracking-wider text-cyan-400">CREATORIAL DEEP RESEARCH CANVAS</span>
          <span class="text-[10px] px-2 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-800 font-bold">SOL CRYSTALLINE ENGINE</span>
        </div>
        
        <div class="flex items-center space-x-4 text-xs font-mono">
          <div>SANDBOX: <span id="sandbox-status" class="text-emerald-400 font-bold">LIVE & OPERATIONAL</span></div>
          <div>AUDIO: <span id="harmonic-freq" class="text-purple-400">528 Hz</span></div>
          <button onclick="exportCurrentApp()" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded text-[11px] transition shadow-[0_0_10px_rgba(6,182,212,0.4)]">
            EXPORT APP (.HTML)
          </button>
        </div>
      </header>

      <!-- Main Central Grid: Editor (Left) + Sandboxed Visualizer (Right) -->
      <main class="w-full flex-1 p-4 grid grid-cols-12 gap-4 overflow-hidden">
        
        <!-- Left Column: Code Editor & Template Selector -->
        <section class="interactive-panel col-span-5 rounded-lg flex flex-col overflow-hidden">
          <div class="p-2.5 border-b border-cyan-500/20 bg-gray-900/60 flex justify-between items-center text-xs">
            <div class="flex space-x-1.5">
              <button onclick="loadTemplate('audio')" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-cyan-300 rounded text-[10px]">Audio Synth</button>
              <button onclick="loadTemplate('infographic')" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-amber-300 rounded text-[10px]">Infographic</button>
              <button onclick="loadTemplate('three')" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-purple-300 rounded text-[10px]">3D Lattice</button>
            </div>
            <button onclick="compileAndRun()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-[10px] flex items-center space-x-1">
              <span>▶ RUN & RENDER</span>
            </button>
          </div>

          <!-- Code Editor Textarea -->
          <div class="flex-1 flex flex-col p-2 bg-black/80">
            <textarea id="code-editor" class="flex-1 w-full bg-transparent text-emerald-400 text-xs font-mono p-2 resize-none outline-none border border-slate-800 rounded leading-relaxed" spellcheck="false"></textarea>
          </div>

          <!-- Mini Terminal & Ledger Stream -->
          <div class="h-32 border-t border-slate-800 p-2 bg-slate-950/90 flex flex-col text-[10px] font-mono">
            <div class="text-slate-500 mb-1 flex justify-between">
              <span>CREATORIAL RUNTIME LOGS</span>
              <button onclick="clearLogs()" class="hover:text-red-400">CLEAR</button>
            </div>
            <div id="runtime-logs" class="flex-1 overflow-y-auto space-y-1 text-slate-400"></div>
          </div>
        </section>

        <!-- Right Column: Live Sandboxed Visualizer & Micro-App Launcher -->
        <section class="interactive-panel col-span-7 rounded-lg flex flex-col overflow-hidden">
          <div class="p-2.5 border-b border-cyan-500/20 bg-gray-900/60 flex justify-between items-center text-xs">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span class="font-bold text-slate-200">LIVE RENDER VIEWPORT (IFRAME SANDBOX)</span>
            </div>
            <div class="flex space-x-2 text-[10px]">
              <button onclick="reloadSandbox()" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">RELOAD</button>
              <button onclick="openInNewTab()" class="px-2 py-0.5 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-800 rounded">POPOUT</button>
            </div>
          </div>

          <!-- Sandboxed Preview Frame Container -->
          <div class="flex-1 bg-black relative p-1">
            <iframe id="live-sandbox-frame" class="w-full h-full border-0 rounded bg-[#010206]" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
          </div>
        </section>
      </main>

      <!-- Bottom Audio Harmonics & Quick Controls -->
      <footer class="interactive-panel w-full px-6 py-2 border-t border-cyan-500/20 flex items-center justify-between text-xs">
        <div class="flex items-center space-x-2">
          <span class="text-slate-400 text-[10px]">HARMONIC GENERATOR:</span>
          <button onclick="pulseHarmonic(432)" class="px-2.5 py-0.5 rounded bg-gray-900 hover:bg-cyan-950 text-cyan-400 border border-cyan-800 text-[10px]">432 Hz</button>
          <button onclick="pulseHarmonic(528)" class="px-2.5 py-0.5 rounded bg-gray-900 hover:bg-indigo-950 text-indigo-400 border border-indigo-800 text-[10px]">528 Hz</button>
          <button onclick="pulseHarmonic(963)" class="px-2.5 py-0.5 rounded bg-gray-900 hover:bg-purple-950 text-purple-400 border border-purple-800 text-[10px]">963 Hz</button>
        </div>
        <div class="text-[10px] text-slate-500 font-mono">
          STATUS: <span class="text-emerald-400 font-bold">ALL GATES OPEN</span> | IMMUTABLE 404 DEFENSE ACTIVE
        </div>
      </footer>
    </div>
  </div>

  <script>
    /* ------------------------------------------------------------- */
    /* 1. CREATORIAL TEMPLATES (MICRO-APPS, INFOGRAPHICS, AUDIO)      */
    /* ------------------------------------------------------------- */
    const TEMPLATES = {
      audio: `<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>body { background: #030712; color: #f8fafc; font-family: monospace; }</style>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-slate-900 border border-cyan-500/30 p-6 rounded-xl shadow-2xl space-y-4 text-center">
    <h1 class="text-lg font-bold text-cyan-400">Web Audio Harmonic Resonator</h1>
    <p class="text-xs text-slate-400">On-the-fly interactive oscillator with lowpass filter modulation.</p>
    
    <div class="flex justify-center gap-3">
      <button onclick="playTone(432)" class="px-3 py-2 bg-cyan-500/20 border border-cyan-500 text-cyan-300 rounded font-bold text-xs">432 Hz</button>
      <button onclick="playTone(528)" class="px-3 py-2 bg-amber-500/20 border border-amber-500 text-amber-300 rounded font-bold text-xs">528 Hz</button>
      <button onclick="playTone(963)" class="px-3 py-2 bg-purple-500/20 border border-purple-500 text-purple-300 rounded font-bold text-xs">963 Hz</button>
    </div>

    <div class="pt-4 border-t border-slate-800 text-[10px] text-slate-500" id="audio-status">Click a frequency to generate tone</div>
  </div>

  <script>
    let ctx;
    function playTone(freq) {
      if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 1.5);
      document.getElementById('audio-status').innerText = 'Playing pure harmonic tone: ' + freq + ' Hz';
    }
  <\/script>
</body>
</html>`,

      infographic: `<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>body { background: #02040a; color: #f8fafc; font-family: monospace; }</style>
</head>
<body class="p-6 flex flex-col items-center justify-center min-h-screen">
  <div class="max-w-lg w-full bg-slate-900/90 border border-amber-500/30 p-6 rounded-xl shadow-2xl space-y-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <h2 class="text-sm font-bold text-amber-400">TELEMETRY INFOGRAPHIC</h2>
      <span class="text-[10px] px-2 py-0.5 bg-amber-950 text-amber-300 rounded border border-amber-800">REALTIME SVG</span>
    </div>

    <!-- Dynamic SVG Chart -->
    <svg viewBox="0 0 400 150" class="w-full h-40 bg-black/60 rounded border border-slate-800 p-2">

      three: `<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
  <style>body { margin: 0; overflow: hidden; background: #010208; }</style>
</head>
<body>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const geom = new THREE.IcosahedronGeometry(4, 2);
    const mat = new THREE.MeshBasicMaterial({ color: 0x06b6d4, wireframe: true });
    const mesh = new THREE.Mesh(geom, mat);
    scene.add(mesh);

    camera.position.z = 12;

    function animate() {
      requestAnimationFrame(animate);
      mesh.rotation.x += 0.005;
      mesh.rotation.y += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  <\/script>
</body>
</html>`
    };

    /* ------------------------------------------------------------- */
    /* 2. COMPILER & LIVE SANDBOX PIPELINE                          */
    /* ------------------------------------------------------------- */
    let currentBlobUrl = null;

    function compileAndRun() {
      const code = document.getElementById('code-editor').value;
      const iframe = document.getElementById('live-sandbox-frame');

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }

      const blob = new Blob([code], { type: 'text/html' });
      currentBlobUrl = URL.createObjectURL(blob);
      iframe.src = currentBlobUrl;

      log("Compiled and deployed new runtime instance to live sandbox.");
    }

    function loadTemplate(key) {
      if (TEMPLATES[key]) {
        document.getElementById('code-editor').value = TEMPLATES[key];
        compileAndRun();
        log("Loaded template: " + key.toUpperCase());
      }
    }

    function reloadSandbox() {
      compileAndRun();
    }

    function openInNewTab() {
      if (currentBlobUrl) {
        window.open(currentBlobUrl, '_blank');
      }
    }

    function exportCurrentApp() {
      const code = document.getElementById('code-editor').value;
      const blob = new Blob([code], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'uniomni_creatorial_app_' + Date.now() + '.html';
      a.click();
      log("Exported standalone application HTML package.");
    }

    function log(msg) {
      const logs = document.getElementById('runtime-logs');
      const time = new Date().toTimeString().split(' ')[0];
      const div = document.createElement('div');
      div.innerHTML = `<span class="text-cyan-400">[${time}]</span> <span class="text-slate-300">${msg}</span>`;
      logs.appendChild(div);
      logs.scrollTop = logs.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('runtime-logs').innerHTML = '';
    }

    /* ------------------------------------------------------------- */
    /* 3. STRATUM 0 & 1 BACKGROUND VIEWPORT (PREVENTS FOOTER COLLISION)*/
    /* ------------------------------------------------------------- */
    const canvas0 = document.getElementById('stratum-0-canvas');
    const ctx0 = canvas0.getContext('2d');
    let angle0 = 0;

    function resizeStratum0() {
      canvas0.width = window.innerWidth;
      canvas0.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeStratum0);
    resizeStratum0();

    function renderStratum0() {
      ctx0.fillStyle = 'rgba(2, 4, 10, 0.25)';
      ctx0.fillRect(0, 0, canvas0.width, canvas0.height);
      const cx = canvas0.width / 2;
      const cy = canvas0.height / 2;
      const baseRad = Math.min(cx, cy) * 0.45;

      ctx0.beginPath();
      for (let t = 0; t < Math.PI * 2; t += 0.02) {
        const p = 0.5 + 0.5 * Math.sin(t * 4 + angle0);
        const r = baseRad * (1 + 0.2 * Math.sin(t * 6 + angle0 * 1.5));
        const x = cx + r * Math.cos(t + angle0 * 0.1);
        const y = cy + r * Math.sin(t + angle0 * 0.1);
        if (t === 0) ctx0.moveTo(x, y); else ctx0.lineTo(x, y);
      }
      ctx0.closePath();
      ctx0.strokeStyle = 'rgba(6, 182, 212, 0.2)';
      ctx0.lineWidth = 1.2;
      ctx0.stroke();

      angle0 += 0.005;
      requestAnimationFrame(renderStratum0);
    }
    renderStratum0();

    // Stratum 1: 3D Torus
    const container1 = document.getElementById('stratum-1-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container1.appendChild(renderer.domElement);

    const torusGeom = new THREE.TorusKnotGeometry(12, 2.5, 100, 16);
    const torusMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, wireframe: true, transparent: true, opacity: 0.2 });
    const torusMesh = new THREE.Mesh(torusGeom, torusMat);
    scene.add(torusMesh);
    camera.position.z = 35;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animateStratum1() {
      requestAnimationFrame(animateStratum1);
      torusMesh.rotation.x += 0.002;
      torusMesh.rotation.y += 0.003;
      renderer.render(scene, camera);
    }
    animateStratum1();

    /* ------------------------------------------------------------- */
    /* 4. WEB AUDIO HARMONICS                                        */
    /* ------------------------------------------------------------- */
    let audioCtx;
    function pulseHarmonic(freq) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
      document.getElementById('harmonic-freq').innerText = freq + ' Hz';
      log('Emitted harmonic tone: ' + freq + ' Hz');
    }

    // Default initialization
    window.onload = () => {
      loadTemplate('audio');
      log("Creatorial Canvas Engine Ready. Visualizer synced.");
    };
  </script>
</body>
</html>
